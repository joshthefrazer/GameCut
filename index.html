<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strike</title>
<link rel="icon" href="./assets/strike-icon-small.svg">
<link rel="stylesheet" href="./styles/fonts.css">
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/glass.css">
<link rel="stylesheet" href="./styles/layout.css">
<link rel="stylesheet" href="./styles/components/controls.css">
<link rel="stylesheet" href="./styles/components/preview.css">
<link rel="stylesheet" href="./styles/components/timeline.css">
<link rel="stylesheet" href="./styles/components/media-pool.css">
<link rel="stylesheet" href="./styles/components/inspector.css">
<link rel="stylesheet" href="./styles/components/export.css">
<link rel="stylesheet" href="./styles/components/home.css">
<link rel="stylesheet" href="./styles/components/help.css">
<link rel="stylesheet" href="./styles/components/transitions.css">
<link rel="stylesheet" href="./styles/components/updates.css">
<link rel="stylesheet" href="./styles/components/crop-studio.css">
<link rel="stylesheet" href="./styles/components/graphics.css">
<link rel="stylesheet" href="./styles/motion.css">
<link rel="stylesheet" href="./styles/overhaul.css">
<link rel="stylesheet" href="./styles/strike.css">
<link rel="stylesheet" href="./styles/components/tools.css">
<link rel="stylesheet" href="./styles/components/themes.css">
<link rel="stylesheet" href="./styles/components/qol23.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<div class="app" id="app">

  <!-- ── HOME ──────────────────────────────────────────────────
       Sits above everything and is shown by the .is-home class on #app.
       The editor stays built underneath rather than being torn down, so
       opening a project is a view change, not a reload. -->
  <section class="home" id="homeScreen">
    <div class="home__bar">
      <span class="brand__mark brand__mark--lg"></span>
      <span class="home__title">STRIKE</span>
      <span class="home__ver" id="homeVer"></span>
      <button class="btn btn--ghost" id="homeHelp" style="margin-left:auto">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.4v.5"/><path d="M12 17.2h.01"/></svg>
        How it works
      </button>
    </div>

    <div class="home__body">
      <h1 class="home__hero">What are you making?</h1>
      <div class="home__starts">
        <button class="start start--hero" data-start="short">
          <span class="start__shape start__shape--tall" aria-hidden="true"></span>
          <span class="start__text"><b>Short</b><span>TikTok, Shorts, Reels · 9:16</span></span>
        </button>
        <button class="start" id="homeNew" data-start="youtube">
          <span class="start__shape start__shape--wide" aria-hidden="true"></span>
          <span class="start__text"><b>YouTube video</b><span>16:9 · long or short</span></span>
        </button>
        <button class="start" data-start="montage">
          <span class="start__bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="start__text"><b>Montage</b><span>Clips cut to a song · beat grid on</span></span>
        </button>
        <button class="start start--drop" data-start="drop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
          <span class="start__text"><b>Bring a recording</b><span>Strike picks the shape for you</span></span>
        </button>
      </div>

      <section class="inbox" id="homeInbox"></section>

      <div class="home__head">
        <b>Your projects</b>
        <span class="home__count" id="homeCount"></span>
        <button class="home__tidy" id="homeTidy" hidden></button>
      </div>
      <div class="home__grid" id="homeGrid"></div>
    </div>
  </section>

  <!-- ── TOP BAR ───────────────────────────────────────────── -->
  <header class="topbar glass glass--flat">
    <div class="topbar__brand" title="Strike">
      <span class="brand__mark"></span>
      <span class="brand__word">STRIKE</span>
    </div>

    <div class="topbar__project">
      <input class="proj-name" id="projName" value="Untitled Project" spellcheck="false" aria-label="Project name">
      <div class="proj-line">
        <span class="proj-meta" id="projMeta">1920×1080 · 60fps</span>
        <button class="savechip" id="saveChip" data-state="idle">
          <i class="savechip__dot"></i><span id="saveChipText">Saved</span>
        </button>
        <button class="vers__btn" id="btnVersions" title="Version history: go back to an earlier version" aria-label="Version history">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
      </div>
    </div>

    <nav class="modes" id="modes" aria-label="Mode">
      <button data-mode="edit" class="is-on" title="Edit: the timeline, preview and inspector">Edit</button>
      <button data-mode="library" id="modeLibrary" title="Library: every animation, big, with its sound">Library</button>
      <button data-mode="export" title="Export: make the video file">Export</button>
    </nav>

    <button class="searchbar" id="btnSearch" title="Find any tool, clip or action (Ctrl+K)">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search clips, tools and actions…</span>
      <kbd>Ctrl K</kbd>
    </button>

    <div class="topbar__actions">
      <button class="btn btn--ghost btn--icon" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-3"/></svg>
      </button>
      <button class="btn btn--ghost btn--icon" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9h-9a7 7 0 0 0 0 14h3"/></svg>
      </button>
      <button class="btn btn--ghost btn--icon" id="btnHistory" title="History: every step you made — click one to go back to it (Ctrl+H)" aria-label="History">
        <svg viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3.5 6h.01"/><path d="M3.5 12h.01"/><path d="M3.5 18h.01"/></svg>
      </button>
      <span class="divider-v"></span>
      <button class="btn btn--ghost" id="btnHome" title="Back to your projects">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 10v10h14V10"/></svg>
        Projects
      </button>
      <button class="btn btn--ghost btn--icon" id="btnSettings" aria-label="Settings" title="Settings: accent colour, layout size (Ctrl+,)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="btn btn--ghost btn--icon" id="btnHelp" aria-label="Help" title="How everything works (?)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.4v.5"/><path d="M12 17.2h.01"/></svg>
      </button>
      <button class="chip chip--ver" id="verChip" title="Version">v—</button>
      <span class="divider-v"></span>
      <button class="btn btn--ghost" id="btnImport" title="Import media (Ctrl+I)">
        <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Import
      </button>
      <button class="btn btn--primary" id="btnExport">
        <svg viewBox="0 0 24 24"><path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M4 19h16"/></svg>
        Export
      </button>
    </div>
  </header>

  <!-- ── WORKSPACE ─────────────────────────────────────────── -->
  <main class="workspace" id="workspace">

    <!-- The rail: one icon per drawer. The drawer closes for a bigger preview. -->
    <nav class="rail" id="leftTabs" aria-label="Panels">
      <button class="tab rail__btn is-active" data-tab="media" id="tabMedia" title="Media: your footage and music">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg><span>Media</span></button>
      <button class="tab rail__btn" data-tab="anim" id="tabAnim" title="Animations: kill counters, titles, callouts — each with its own sound">
        <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Animate</span></button>
      <button class="tab rail__btn" data-tab="pads" id="tabPads" title="Sound pads: twelve sounds on twelve keys">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span>Pads</span></button>
      <button class="tab rail__btn" data-tab="text" id="tabText" title="Text: titles, captions and your saved texts">
        <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg><span>Text</span></button>
      <button class="tab rail__btn" data-tab="gfx" id="tabGfx" title="Graphics: logos, stickers and cut-outs">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="8" r="1.6"/></svg><span>Graphics</span></button>
      <button class="tab rail__btn" data-tab="trans" id="tabTrans" title="Transitions: how one shot becomes the next">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="9" height="12" rx="2"/><rect x="13" y="6" width="9" height="12" rx="2"/><path d="M9 12h6"/></svg><span>Cuts</span></button>
      <button class="tab rail__btn" data-tab="fx" id="tabFx" title="Effects: zooms, shakes, flashes and more">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg><span>Effects</span></button>
      <span class="rail__spacer"></span>
      <button class="rail__btn rail__collapse" id="btnDrawer" title="Hide the drawer for a bigger preview" aria-label="Hide the drawer">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    </nav>

    <aside class="panel panel--left glass" id="leftPanel">
      <div class="drawer__head">
        <b id="drawerTitle">Media</b>
        <button class="btn btn--ghost btn--sm" id="btnDrawerClose" title="Hide this drawer" aria-label="Hide the drawer">
          <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      </div>
      <div class="panel__body">
        <section class="tabpane is-active" data-pane="media" id="poolRoot"></section>
        <section class="tabpane" data-pane="anim" id="animRoot"></section>
        <section class="tabpane" data-pane="pads" id="padsRoot"></section>
        <section class="tabpane" data-pane="text" id="textRoot"></section>
        <section class="tabpane" data-pane="gfx" id="gfxRoot"></section>
        <section class="tabpane" data-pane="trans" id="transRoot"></section>
        <section class="tabpane" data-pane="fx" id="fxRoot"></section>
      </div>
    </aside>

    <div class="gutter gutter--v" data-resize="left" role="separator" aria-orientation="vertical"></div>

    <section class="stage">
      <div class="preview glass" id="previewPanel">
        <div class="preview__viewport" id="previewViewport">
          <div class="preview__frame" id="previewFrame">
            <canvas id="previewCanvas"></canvas>
            <div class="preview__overlay" id="previewOverlay"></div>
            <svg class="preview__guides" id="previewGuides" aria-hidden="true"></svg>
          </div>

          <!-- Tools float on the picture instead of taking a row above it. -->
          <div class="pv-float pv-float--tl" id="pvTools">
            <button class="tgl" id="btnCrop" title="Crop out a region (C) — draw a box on the picture and it becomes its own layer on top">
              <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>Crop</button>
            <button class="tgl is-active" id="tglGuides" title="Safe-area guides">Guides</button>
            <button class="tgl" id="tglGrid" title="Rule-of-thirds grid">Grid</button>
            <button class="tgl is-active" id="tglSnap" title="Snapping (N)">Snap</button>
            <button class="tgl" id="btnCompare" title="Compare: drag the divider to see the picture with and without your effects, looks and motion">Compare</button>
            <button class="tgl tgl--volt" id="btnLayouts" title="Make it vertical: facecam and game layouts for shorts">Vertical</button>
          </div>
          <div class="pv-float pv-float--tr seg" role="group" aria-label="Aspect ratio" id="aspectSeg">
            <button class="seg__btn is-active" data-ar="16:9" title="Landscape 16:9 — YouTube"><i class="ar ar--169"></i>16:9</button>
            <button class="seg__btn" data-ar="9:16" title="Vertical 9:16 — TikTok, Shorts, Reels"><i class="ar ar--916"></i>9:16</button>
            <button class="seg__btn" data-ar="1:1" title="Square 1:1"><i class="ar ar--11"></i>1:1</button>
            <button class="seg__btn" data-ar="4:5" title="Portrait 4:5 — feed posts"><i class="ar ar--45"></i>4:5</button>
          </div>
          <div class="pv-float pv-float--bl">
            <span class="chip" id="resChip">1920 × 1080</span>
            <label class="qsel" title="Preview quality. Auto matches your screen. Lower is smoother with long or 4K footage — it never affects your export.">
              <span>Preview</span>
              <select id="previewQuality">
                <option value="0" selected>Auto</option>
                <option value="1">Full</option>
                <option value="0.5">Half</option>
                <option value="0.25">Quarter</option>
              </select>
            </label>
            <span class="chip chip--mono" id="fpsChip">— fps</span>
          </div>
          <div class="pv-float pv-float--br">
            <button class="tbtn" id="btnThumb" title="Thumbnail maker: your best frame plus big words" aria-label="Thumbnail maker">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 15h5M6 11.5h8"/><path d="m15 15 2-3 2 3"/></svg>
            </button>
            <button class="tbtn" id="btnSnapshot" title="Save this frame as a picture — for thumbnails (Ctrl+Shift+S)" aria-label="Save this frame as a picture">
              <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            </button>
            <button class="tbtn" id="btnFullscreen" title="Fullscreen preview (F)">
              <svg class="ico-fsEnter" viewBox="0 0 24 24"><path d="M8 3H3v5"/><path d="M16 3h5v5"/><path d="M16 21h5v-5"/><path d="M8 21H3v-5"/></svg>
              <svg class="ico-fsExit" viewBox="0 0 24 24" hidden><path d="M3 8h5V3"/><path d="M21 8h-5V3"/><path d="M21 16h-5v5"/><path d="M3 16h5v5"/></svg>
            </button>
          </div>
        </div>

        <div class="transport" id="transport">
          <div class="transport__left">
            <span class="playstate" id="playState" data-playing="false">
              <i class="playstate__dot"></i><span class="playstate__label">Paused</span>
            </span>
            <span class="tc tc--big" id="tcCurrent">00:00:00:00</span>
            <span class="tc tc--dim">/ <b id="tcTotal">00:00:00:00</b></span>
          </div>
          <div class="transport__center">
            <button class="tbtn" id="btnStart" title="Go to start (Home)"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M19 5 9 12l10 7z" fill="currentColor" stroke="none"/></svg></button>
            <button class="tbtn" id="btnPrevFrame" title="Previous frame (←)"><svg viewBox="0 0 24 24"><path d="M15 5 7 12l8 7z" fill="currentColor" stroke="none"/></svg></button>
            <button class="tbtn tbtn--play" id="btnPlay" title="Play (Space)" aria-pressed="false">
              <svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5.5 19 12 8 18.5z" fill="currentColor" stroke="none"/></svg>
              <svg class="ico-pause" viewBox="0 0 24 24" hidden><path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="tbtn" id="btnNextFrame" title="Next frame (→)"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7z" fill="currentColor" stroke="none"/></svg></button>
            <button class="tbtn" id="btnEnd" title="Go to end (End)"><svg viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M5 5l10 7-10 7z" fill="currentColor" stroke="none"/></svg></button>
            <span class="divider-v"></span>
            <button class="tbtn" id="btnLoop" title="Loop playback (Shift+L). Loops In to Out when both are set"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
          </div>
          <div class="transport__right">
            <button class="tbtn" id="btnMute" title="Mute (M)"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6.5a8 8 0 0 1 0 11"/></svg></button>
            <input type="range" class="rng rng--vol" id="masterVol" min="0" max="100" value="85" aria-label="Master volume">
          </div>
        </div>
      </div>
    </section>

    <div class="gutter gutter--v" data-resize="right" role="separator" aria-orientation="vertical"></div>

    <aside class="panel panel--right glass" id="rightPanel">
      <div class="panel__body">
        <section class="tabpane is-active" data-pane="inspect" id="inspectorRoot"></section>
      </div>
    </aside>
  </main>

  <div class="gutter gutter--h" data-resize="bottom" role="separator" aria-orientation="horizontal"></div>

  <!-- ── TIMELINE ──────────────────────────────────────────── -->
  <footer class="timeline glass" id="timelinePanel">
    <div class="timeline__bar">
      <div class="tl-seg" role="group" aria-label="Timeline tool">
        <button class="tl-btn is-active" id="btnToolSelect" title="Select: pick, move and trim clips (V)" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg><span>Select</span><kbd>V</kbd></button>
        <button class="tl-btn" id="btnToolRazor" title="Razor: click a clip to cut it (B)" aria-pressed="false">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg><span>Razor</span><kbd>B</kbd></button>
        <button class="tl-btn" id="btnToolHand" title="Hand: drag to look around (H)" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a8 8 0 0 0 16 0v-3a2 2 0 0 0-4 0"/></svg><span>Hand</span><kbd>H</kbd></button>
      </div>
      <div class="tl-tools">
        <button class="tbtn" id="btnSplit" title="Split at playhead (S)"><svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="m7 8 5 4-5 4"/><path d="m17 8-5 4 5 4"/></svg></button>
        <button class="tbtn" id="btnDelete" title="Delete selection (Del)"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg></button>
        <button class="tbtn" id="btnDuplicate" title="Duplicate (Ctrl+D)"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>
        <button class="tbtn" id="btnAddText" title="Add text (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg></button>
        <button class="tbtn" id="btnMarker" title="Add marker (M)"><svg viewBox="0 0 24 24"><path d="M6 3v18"/><path d="M6 4h11l-2.5 3.5L17 11H6z" fill="currentColor" stroke="none"/></svg></button>
        <button class="tbtn tbtn--wide" id="btnAddLane" title="Add a lane: Video, Facecam, Text, Voice, Music or SFX — each set up for its job" aria-haspopup="menu"><svg viewBox="0 0 24 24"><path d="M3 6h12M3 12h8M3 18h12"/><path d="M18 9v6M15 12h6"/></svg><span>Lane</span></button>
      </div>
      <div class="tl-tools">
        <button class="tgl is-active" id="btnMagnet" title="Snap: clips stick to the playhead, markers and each other (N)" aria-pressed="true">Snap</button>
        <button class="tgl is-active" id="btnRipple" title="Ripple: deleting closes the gap; dropping onto a clip slots in beside it" aria-pressed="true">Ripple</button>
        <button class="tgl" id="btnCloseGaps" title="Close every gap on the main lane in one step">Close gaps</button>
      </div>

      <div class="tl-status" id="tlStatus" aria-live="polite"></div>

      <div class="tl-beat" id="tlBeat">
        <button class="tgl" id="btnBeatGrid" title="Beat sync: show the beat grid and snap to it" aria-pressed="false">Beat sync</button>
        <label class="mini-field" title="Tempo of your music, in beats per minute">
          <span>BPM</span>
          <input type="number" id="bpmInput" value="128" min="40" max="300" step="0.5">
        </label>
        <button class="tbtn tbtn--wide" id="btnTapTempo" title="Tap tempo">Tap</button>
      </div>

      <div class="tl-zoom">
        <button class="tgl tgl--quiet" id="btnTrackSize" title="Lane height: fit them all on screen, or Small, Medium or Large">Fit lanes</button>
        <button class="tbtn" id="btnZoomOut" title="Zoom out (−)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <input type="range" class="rng" id="zoomRange" min="0" max="1000" value="420" aria-label="Timeline zoom">
        <button class="tbtn" id="btnZoomIn" title="Zoom in (+)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <span class="chip chip--mono" id="zoomChip">100%</span>
        <button class="tgl" id="btnZoomFit" title="Fit the whole project (Shift+Z)">Fit all</button>
      </div>
    </div>

    <div class="tl-overview">
      <span class="tl-overview__label">Overview</span>
      <canvas id="tlOverview" aria-label="Whole project overview: drag the frame to move around"></canvas>
    </div>

    <div class="timeline__body">
      <div class="timeline__headers" id="trackHeaders"></div>
      <div class="timeline__view" id="timelineView">
        <canvas id="timelineCanvas"></canvas>
        <div class="tl-drop" id="tlDrop"></div>
        <div class="tl-vscroll" id="tlVScroll"><div class="tl-vscroll__thumb" id="tlVThumb"></div></div>
      </div>
    </div>
    <div class="tl-hscroll" id="tlHScroll"><div class="tl-hscroll__thumb" id="tlHThumb"></div></div>
  </footer>
</div>

<input type="file" id="filePicker" multiple accept="video/*,audio/*,image/*,.ttf,.otf,.woff,.woff2" hidden>
<div class="modal" id="exportModal" hidden></div>
<div class="toast-stack" id="toasts"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
